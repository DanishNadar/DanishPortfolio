<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/brand/dn-logo-192.png" />
    <link rel="apple-touch-icon" href="/brand/dn-logo-192.png" />
    <title>Danish Nadar — AI Engineer · Robotics · Autonomy</title>
    <meta name="description" content="AI engineer building robotics, autonomy, and intelligent products from idea to working prototype." />
    <meta property="og:title" content="Danish Nadar — AI Engineer" />
    <meta property="og:description" content="AI · Robotics · Autonomy · Security automation." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking first paint; text shows in a fallback face, then swaps. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@500;600;700;800&family=Zen+Dots&display=swap" />
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@500;600;700;800&family=Zen+Dots&display=swap" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@500;600;700;800&family=Zen+Dots&display=swap" /></noscript>
    <script>
      // Apply a remembered reduced-effects decision before first paint (see src/lib/perfMode.ts).
      try {
        var fx = new URLSearchParams(location.search).get("fx") || localStorage.getItem("dn-fx") || sessionStorage.getItem("dn-fx");
        if (fx === "lite" || fx === "auto-lite") document.documentElement.classList.add("perf-lite");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
